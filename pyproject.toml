[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitleaks-lite-cli"
version = "1.0.0"
description = "Heuristically scan files or a directory for strings that look like common secrets, using regex and entropy checks only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "sidcore-dev" }]
keywords = ["secrets", "security", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/sidcore-dev/gitleaks-lite-cli"
Repository = "https://github.com/sidcore-dev/gitleaks-lite-cli"
Issues = "https://github.com/sidcore-dev/gitleaks-lite-cli/issues"

[project.scripts]
gitleaks-lite-cli = "gitleaks_lite_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
